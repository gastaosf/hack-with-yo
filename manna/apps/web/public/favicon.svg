<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Manna">
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" fill="#0d1321"/>
  <!-- Falling particles mark — scaled to 32px container -->
  <!-- Particle 1 — smallest, top -->
  <circle cx="16" cy="7"  r="2.2" fill="#2d9f6f" opacity="0.70"/>
  <!-- Particle 2 -->
  <circle cx="16" cy="13" r="3.0" fill="#2d9f6f" opacity="0.82"/>
  <!-- Particle 3 -->
  <circle cx="16" cy="20" r="3.9" fill="#4ec99b" opacity="0.92"/>
  <!-- Particle 4 — largest, bottom -->
  <circle cx="16" cy="28" r="3.2" fill="#4ec99b" opacity="1.0"/>
</svg>

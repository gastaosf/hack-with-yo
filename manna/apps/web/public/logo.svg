<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none">
  <!-- Falling particles symbol (emerald on dark, designed for light bg use) -->
  <!-- Particle 1 — smallest, top-right -->
  <circle cx="18.8" cy="12.2" r="2.8" fill="#2d9f6f" opacity="0.7"/>
  <!-- Particle 2 -->
  <circle cx="17.9" cy="17.2" r="3.8" fill="#2d9f6f" opacity="0.82"/>
  <!-- Particle 3 -->
  <circle cx="17.0" cy="23.2" r="5.0" fill="#2d9f6f" opacity="0.90"/>
  <!-- Particle 4 — largest, bottom-left -->
  <circle cx="15.9" cy="30.4" r="6.8" fill="#2d9f6f" opacity="0.98"/>

  <!-- Wordmark -->
  <text
    x="32"
    y="27"
    font-family="Outfit, -apple-system, sans-serif"
    font-size="22"
    font-weight="500"
    letter-spacing="3.3"
    fill="#0d1321"
  >manna</text>
</svg>
